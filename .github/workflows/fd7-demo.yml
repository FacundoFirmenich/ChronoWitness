name: FD7 demo and Streamlit container
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_fd7_demo.py
      - run: python tools/build_evidence.py --check
      - if: runner.os == 'Linux'
        run: python tools/check_atlas_browser.py
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f Dockerfile.streamlit -t chronowitness-demo .
      - name: Start and check the Streamlit service
        shell: bash
        run: |
          docker run --rm -d --name cw-demo -p 127.0.0.1:8501:8501 chronowitness-demo
          trap 'docker logs cw-demo; docker stop cw-demo' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8501/_stcore/health
          curl --fail --silent http://127.0.0.1:8501/ | grep -q '<title>Streamlit</title>'
