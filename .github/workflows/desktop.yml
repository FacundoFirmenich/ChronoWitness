name: Build and verify native reproducibility packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 -r requirements-assay.txt
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          CW_MSYS: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $compiler = Join-Path $env:CW_MSYS 'mingw64/bin/g++.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw "GNU C++ compiler unavailable on the runner" }
          "CW_CXX=$compiler" >> $env:GITHUB_ENV
      - run: python tools/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          path: |
            research/results/desktop/ChronoWitness-*.zip
            research/results/desktop/ChronoWitness-*.verification.json
          if-no-files-found: error
