name: Verify E6 E8 and FD8 local frontier
on:
  push:
    branches: [e6-e8-fd8-local-frontier-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Retrieve exact campaign archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.14.0 --pattern '*.zip' --dir archives
          python research/e6-e8-fd8/prepare_ci.py
      - name: Reconstruct local metrics and independent phase laws
        working-directory: reproduction/campaign
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python verify_e6.py
          python verify_e8.py
          python verify_design_profiles.py
      - name: Recompute the certified kinetic comparison
        working-directory: reproduction/design
        run: python compare_kinetics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chronowitness-e6-e8-fd8-verification
          path: |
            reproduction/campaign/*VERIFICATION_SUMMARY.json
            reproduction/campaign/INDEPENDENT_PROFILE_CHECK.json
            reproduction/design/KINETIC_COMPARISON.json
          if-no-files-found: error
