name: Reproduce public scientific release
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned assay dependencies
        run: python -m pip install -r requirements-assay.txt
      - name: Reproduce and verify the scientific release
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python reproduce_release.py
      - name: Verify local calibration evidence and support ledger
        run: python research/e4-local/verify_and_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chronowitness-code-data-verification
          path: |
            research/results/PUBLIC_VERIFICATION.json
            research/results/REPRODUCTION_DIFFERENCES.json
            research/results/ASSAY*.json
            research/results/ASSAY*.csv
            research/results/ASSAY*.txt
          if-no-files-found: error
