name: Reproduce public scientific release
on:
  push:
    branches: ["Ulalito's-Island"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Reproduce and verify the scientific release
        run: python reproduce_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chronowitness-code-data-verification
          path: research/results/PUBLIC_VERIFICATION.json
          if-no-files-found: error
