name: Reproduce nested jurisdiction audit E5
on:
  push:
    branches: [e5-nested-jurisdictions-20261111]
    paths: ['research/e5-nested/**', '.github/workflows/e5-nested.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        run: python -m pip install numpy==2.3.5
      - name: Extract frozen code and measured-data summaries
        run: python -m zipfile -e research/e5-nested/ChronoWitness_E5_REPRODUCTION.zip e5-reproduction
      - name: Reproduce every scientific output and independently reconstruct the lattice
        working-directory: e5-reproduction/e5-nested-20261111
        run: |
          OPENBLAS_NUM_THREADS=1 python reproduce.py
          OPENBLAS_NUM_THREADS=1 python verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chronowitness-e5-reproduction
          path: |
            e5-reproduction/e5-nested-20261111/reproduced-results/REPRODUCTION_RECEIPT.json
            e5-reproduction/e5-nested-20261111/results/INDEPENDENT_VERIFICATION.json
          if-no-files-found: error
