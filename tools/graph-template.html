<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoWitness · Evidence Atlas</title>
<style>
:root{color-scheme:dark;background:#151b36;color:#edf1ff;font:16px system-ui,sans-serif;--border:#49598d;--muted:#bfc9ec}
*{box-sizing:border-box}body{max-width:1550px;margin:auto;padding:clamp(12px,3vw,36px)}h1,h2,h3,p{margin:.3em 0 .65em}h1{font:500 clamp(2.2rem,5vw,4rem) Georgia,serif}p{line-height:1.5}a{color:#a9d1ff}code{overflow-wrap:anywhere}
button,select,input{font:inherit;background:#293762;color:inherit;border:1px solid var(--border);border-radius:.6rem;padding:.52rem .65rem;min-height:38px}button{cursor:pointer}button[aria-pressed=true]{background:#4b4785}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,svg:focus-visible{outline:3px solid #edb1e8;outline-offset:3px}
.grid{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(295px,1fr);gap:12px}.card{border:1px solid var(--border);border-radius:1rem;background:#202947;overflow:hidden}.bar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.6rem}.card aside,.body{padding:1rem}.guide{background:#34365b}.hint,small{color:var(--muted)}#graph{display:block;width:100%;height:clamp(330px,55vw,620px);background:#182243;touch-action:none}.node{cursor:pointer}.node:focus rect{stroke:#f8c6e9;stroke-width:3}.edge{cursor:pointer}.edge:focus{stroke:#fff1fa;stroke-width:5}.trace{stroke-dasharray:9 5;animation:flow 1.7s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dasharray:none}}
#detail h3{margin-top:1rem}.relation{display:block;width:100%;text-align:left;margin:.35em 0;font-size:.87rem}.badge{font-size:.79rem;color:#f4bddf;border:1px solid #8673ba;padding:.18rem .5rem;border-radius:10rem;display:inline-block}.tab{padding-left:.7rem}.wide{grid-template-columns:1fr}.legend{padding:.6rem .8rem}
@media(max-width:860px){.grid{grid-template-columns:1fr}.bar button,.bar select,.bar input{font-size:.9rem}#graph{height:420px}}
</style>
<header><div class="bar"><button id="language" aria-label="Change language">Español</button></div><h1 id="title"></h1><p id="intro" class="hint"></p></header>
<nav id="routes" class="bar" aria-label="Guided routes"></nav>
<section id="tour" class="bar guide" hidden><strong id="station"></strong><button id="previous"></button><button id="next"></button><button id="play"></button><button id="exit"></button></section>
<main id="grid" class="grid">
<section class="card">
<div id="controls" class="bar">
<select id="group" aria-label="Category"></select><select id="status" aria-label="Status"></select>
<input id="search" type="search" aria-label="Search claims"><select id="selectClaim" aria-label="Open claim"></select>
</div>
<div class="bar"><button id="map"></button><button id="argument"></button><button id="witness"></button><button id="focus"></button><button id="lock"></button><button id="fit"></button>
<button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="turn" aria-label="Rotate">↻</button>
</div>
<svg id="graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" tabindex="0" aria-label="Evidence map"></svg>
<p id="hint" class="legend hint"></p>
</section>
<aside id="inspector" class="card body">
<div class="bar" id="levels"><button data-level="0"></button><button data-level="1"></button><button data-level="2"></button></div>
<div id="detail" aria-live="polite"></div>
<div class="bar"><button id="json">JSON</button><button id="svg">SVG</button><a id="share"></a></div>
</aside>
</main>
<script type="application/json" id="ledger">__LEDGER__</script>
<script>__SCRIPT__</script>
</html>
